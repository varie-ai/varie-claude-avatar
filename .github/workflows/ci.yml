name: CI

on:
  push:
    branches: [main]
    paths:
      - 'daemon/**'
      - 'plugin/**'
  pull_request:
    branches: [main]
    paths:
      - 'daemon/**'
      - 'plugin/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: daemon/package-lock.json

      - name: Install dependencies
        working-directory: daemon
        run: npm ci

      - name: Build
        working-directory: daemon
        run: npm run build

      - name: Verify plugin scripts are executable
        run: |
          test -x plugin/scripts/ensure-daemon-running
          test -x plugin/scripts/install-daemon
          test -x plugin/scripts/varie-avatar-notify
          echo "All plugin scripts are executable"

      - name: Verify hooks.json is valid JSON
        run: python3 -c "import json; json.load(open('plugin/hooks/hooks.json'))"
